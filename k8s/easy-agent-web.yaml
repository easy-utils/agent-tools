# Easy Agent web front ends: static nginx hosts for the browser clients built
# from the sibling app repos. Each image is produced by the app's own
# tool/build-web-image.sh (forgejo OCI, namespace easylab):
#
#   agent-flutter  -> agent-flutter/tool/build-web-image.sh   (Dockerfile.web)
#   agent-compose  -> agent-compose/tool/build-web-image.sh (Dockerfile.web)
#
# Replace the image tags with the freshly built ones (or `kubectl -n temp set
# image`) then apply. All serve on 8080 with /healthz; the compose image also
# sets COOP/COEP (Compose/Wasm needs SharedArrayBuffer).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-flutter
  namespace: temp
  labels: { app: agent-flutter }
spec:
  replicas: 1
  selector: { matchLabels: { app: agent-flutter } }
  template:
    metadata:
      labels: { app: agent-flutter }
    spec:
      containers:
        - name: web
          image: forgejo.develop.10.199.64.20.nip.io/easylab/agent-flutter:20260919092348
          imagePullPolicy: IfNotPresent
          ports: [ { containerPort: 8080, protocol: TCP } ]
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            limits: { cpu: 200m, memory: 128Mi }
            requests: { cpu: 20m, memory: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: agent-flutter
  namespace: temp
  labels: { app: agent-flutter }
spec:
  type: ClusterIP
  selector: { app: agent-flutter }
  ports: [ { name: http, port: 80, targetPort: 8080 } ]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-compose
  namespace: temp
  labels: { app: agent-compose }
spec:
  replicas: 1
  selector: { matchLabels: { app: agent-compose } }
  template:
    metadata:
      labels: { app: agent-compose }
    spec:
      containers:
        - name: web
          image: forgejo.develop.10.199.64.20.nip.io/easylab/agent-compose:20260919095044
          imagePullPolicy: IfNotPresent
          ports: [ { containerPort: 8080, protocol: TCP } ]
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            limits: { cpu: 200m, memory: 128Mi }
            requests: { cpu: 20m, memory: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: agent-compose
  namespace: temp
  labels: { app: agent-compose }
spec:
  type: ClusterIP
  selector: { app: agent-compose }
  ports: [ { name: http, port: 80, targetPort: 8080 } ]
